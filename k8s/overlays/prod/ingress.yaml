# Legacy shared-domain routes, now redirect-only. The permanent-redirect
# annotation applies to every rule in this object, so nothing that proxies
# to the service may live here. $request_uri keeps the /prospero/... path and
# query, which line up 1:1 with the dedicated host's mount path.
#
# The propercourse.app rule is removed by the ProperCourse apex cutover
# (the apex moves to static hosting with its own forwarding page).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prospero
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: "https://prospero.propercourse.app$request_uri"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - propercourse.app
        - proper-course.app
        - proper-score.app
      # Owned by course-server's ingress; referenced, never modified.
      secretName: proper-course-tls
  rules:
    - host: propercourse.app
      http:
        paths:
          - pathType: Prefix
            path: /prospero
            backend:
              service:
                name: prospero
                port:
                  number: 80
    - host: proper-course.app
      http:
        paths:
          - pathType: Prefix
            path: /prospero
            backend:
              service:
                name: prospero
                port:
                  number: 80
    - host: proper-score.app
      http:
        paths:
          - pathType: Prefix
            path: /prospero
            backend:
              service:
                name: prospero
                port:
                  number: 80
