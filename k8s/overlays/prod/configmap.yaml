apiVersion: v1
kind: ConfigMap
metadata:
  name: prospero-config
data:
  # Mounted under /prospero so links from the old shared-domain URLs map
  # 1:1 onto the dedicated host (see ingress.yaml / ingress-subdomain.yaml).
  PROSPERO_BASE_PATH: "/prospero"
  # WebAuthn relying party stays the registrable parent domain. Passkeys are
  # bound to the RP ID, so changing it invalidates existing passkeys; the
  # browser accepts a parent-domain RP ID from a subdomain origin.
  WEBAUTHN_RP_ID: "propercourse.app"
  # webauthn-swift matches one exact origin, so passkey sign-in works only
  # on this host — which is why the old routes redirect rather than proxy.
  WEBAUTHN_RP_ORIGIN: "https://prospero.propercourse.app"
  BASE_URL: "https://prospero.propercourse.app/prospero"
